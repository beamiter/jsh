name: Research controller

on:
  push:
    paths:
      - '.github/workflows/research.yml'
      - 'scripts/jsh_research.py'
      - 'tests/test_research.py'
      - 'tests/research_cli.rs'
      - 'src/research.rs'
      - 'src/main.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  pull_request:
    paths:
      - '.github/workflows/research.yml'
      - 'scripts/jsh_research.py'
      - 'tests/test_research.py'
      - 'tests/research_cli.rs'
      - 'src/research.rs'
      - 'src/main.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Test controller without models, credentials or GPUs
        run: python3 -m unittest discover -s tests -p test_research.py -v
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test embedded CLI without AI
        run: cargo test --locked --no-default-features --test research_cli
      - name: Test embedded CLI with AI
        run: cargo test --locked --all-features --test research_cli

name: Research controller
on:
  push:
    branches: [master, 'agent/research-*']
    paths: ['scripts/jsh_research*.py', 'tests/test_research*.py', 'tests/research*.rs', 'src/**', 'Cargo.*', '.github/workflows/research.yml']
  pull_request:
    paths: ['scripts/jsh_research*.py', 'tests/test_research*.py', 'tests/research*.rs', 'src/**', 'Cargo.*', '.github/workflows/research.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_research*.py' -v
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked ${{ matrix.features }} --no-fail-fast
      - name: Run all research cases against the actual binary
        run: JSH_RESEARCH_BINARY="$PWD/target/debug/jsh" python3 -m unittest discover -s tests -p 'test_research*.py' -v

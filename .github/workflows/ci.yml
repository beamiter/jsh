name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: clippy

      - name: Clippy with all features
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Clippy without default features
        run: cargo clippy --all-targets --no-default-features --locked -- -D warnings

  supply-chain:
    # Added after jsh was found shipping serde_yaml 0.9.34+deprecated: an
    # abandoned crate with no successor release, so Dependabot had nothing to
    # bump it to and no other job here ever looked at an advisory. Without this
    # step an unpatchable dependency can sit in the tree indefinitely with every
    # check green. Policy and its reasoning live in deny.toml.
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache cargo-deny build data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/cargo-deny-target
          key: cargo-deny-${{ env.CARGO_DENY_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the pinned cargo-deny version
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$HOME/.cache/cargo-deny-target" \
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" \
            --locked --force
          test "$(cargo deny --version)" = "cargo-deny $CARGO_DENY_VERSION"

      - name: Check advisories, banned crates, and sources
        run: cargo deny --locked --all-features check advisories bans sources

  test-default:
    name: Tests (AI enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: tests-default

      - name: Run tests with all features
        run: cargo test --all-features --locked --no-fail-fast

  test-core:
    name: Tests (core only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: tests-core

      - name: Run tests without default features
        run: cargo test --no-default-features --locked --no-fail-fast

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: docs

      - name: Build API documentation
        run: cargo doc --all-features --locked --no-deps

  macos-check:
    name: macOS source compatibility
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: macos-check

      - name: Check all targets with all features
        run: cargo check --all-targets --all-features --locked

  installer:
    # Keep this display name stable for existing required-check rules. The job
    # now validates both shipped scripts and their end-to-end harnesses.
    name: Installer script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck shipped scripts
        # Intentional remote-shell quoting is documented at its source, so the
        # default ShellCheck severity can remain a release gate.
        run: shellcheck -s sh scripts/install-jsh.sh scripts/jsh-remote.sh

      - name: Install and update against a fake release
        run: ./scripts/test-install-jsh.sh

      - name: Deploy into fake remote transports
        run: ./scripts/test-jsh-remote.sh

  release-build:
    name: Release build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          shared-key: release

      - name: Build release binary
        run: cargo build --release --all-features --locked

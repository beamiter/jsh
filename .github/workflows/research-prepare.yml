name: Prepare research integration
on:
  push:
    branches: ['agent/autoresearch-bridge-20261028']
    paths: ['.github/workflows/research-prepare.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt
      - name: Apply bounded integration patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path, old, new):
              p = Path(path)
              source = p.read_text()
              assert source.count(old) == 1, (path, old)
              p.write_text(source.replace(old, new))
          replace('Cargo.toml', 'f269c3c6afafcf9b6d60b3cccd741649fdb74576', '79be53893742d7a47baa98d7869a9674f35996b3')
          replace('src/cli.rs', '    "  jsh doctor [--json] [--strict] [--rcfile FILE]\\n\\n",',
                  '    "  jsh doctor [--json] [--strict] [--rcfile FILE]\\n",\n    "  jsh research --help    Bounded experiments and jagent proposal bridge\\n\\n",')
          replace('scripts/jsh_research.py',
                  '            require(process.returncode == 0, f"evaluation exited with status {process.returncode}")',
                  '            if store.stopped():\n                raise Stopped("stop requested")\n            require(time.monotonic() - started <= request["timeout_seconds"], "evaluation timed out")\n            require(process.returncode == 0, f"evaluation exited with status {process.returncode}")')
          replace('scripts/jsh_research.py',
                  '        trial = {key: source[key] for key in ("commit", "hypothesis", "kind")}',
                  '        require(source["kind"] != "baseline" or not any(\n            item["kind"] == "baseline" and item["status"] in ("queued", "running")\n            for item in state["trials"]), "baseline attempt already pending")\n        trial = {key: source[key] for key in ("commit", "hypothesis", "kind")}')
          replace('docs/autoresearch.md', '# jsh research: bounded automated-experiment control plane\n',
                  '# jsh research: bounded automated-experiment control plane\n\nFor the context-bound jagent integration, see [autoresearch-bridge.md](autoresearch-bridge.md).\n')
          PY
      - run: cargo fmt --all
      - name: Refresh only required locked git dependency
        run: cargo check --all-features
      - name: Exercise controller and bridge regressions
        run: python3 -m unittest discover -s tests -p 'test_research*.py' -v
      - name: Exercise the real cross-language binary
        run: cargo test --locked --all-features --test research_bridge --test research_cli
      - name: Save prepared files and remove this one-shot workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['GITHUB_REF_NAME']
          sha = os.environ['GITHUB_SHA']
          assert repo == 'beamiter/jsh' and branch == 'agent/autoresearch-bridge-20261028'
          allowed = {'Cargo.toml', 'Cargo.lock', 'src/cli.rs', 'src/research.rs',
                     'scripts/jsh_research.py', 'tests/research_bridge.rs', 'docs/autoresearch.md'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          assert changed <= allowed, changed
          def api(path, body=None, method=None):
              request = urllib.request.Request('https://api.github.com/repos/' + repo + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'},
                  method=method or ('GET' if body is None else 'POST'))
              with urllib.request.urlopen(request) as response:
                  return json.load(response)
          assert api('/git/ref/heads/' + branch)['object']['sha'] == sha
          base = api('/git/commits/' + sha)['tree']['sha']
          entries = [{'path': path, 'mode': '100644', 'type': 'blob',
                      'content': pathlib.Path(path).read_text()} for path in sorted(changed)]
          entries.append({'path': '.github/workflows/research-prepare.yml', 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': base, 'tree': entries})['sha']
          commit = api('/git/commits', {'message': 'fix(research): bind jagent, invalidate stale work, and close execution races',
                      'tree': tree, 'parents': [sha]})['sha']
          api('/git/refs/heads/' + branch, {'sha': commit, 'force': False}, 'PATCH')
          print('PREPARED_COMMIT=' + commit)
          PY
